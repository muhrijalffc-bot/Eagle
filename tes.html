<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasku — Dashboard Akuntansi</title>
<style>
:root{--bg:#f6f7fb;--kartu:#fff;--teks:#0f172a;--abu:#64748b;--garis:#e8ebf2;--utama:#4f46e5;--utama2:#eef2ff;--hijau:#10b981;--merah:#f43f5e;--sisi:#0f172a}
[data-tema="gelap"]{--bg:#0b1020;--kartu:#131a2e;--teks:#e5e9f5;--abu:#8b95b3;--garis:#222b45;--utama2:#1e2547;--sisi:#080c18}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--teks);font-size:14px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* sidebar */
aside{background:var(--sisi);color:#cbd5e1;padding:22px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:0 10px 24px}
.logo i{background:var(--utama);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-style:normal}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#94a3b8;text-decoration:none;cursor:pointer;margin-bottom:4px}
nav a:hover{background:#ffffff12;color:#fff}
nav a.aktif{background:var(--utama);color:#fff}
nav a.mati{opacity:.45;cursor:default}
.profil{position:absolute;bottom:20px;left:14px;right:14px;display:flex;gap:10px;align-items:center;padding:10px;background:#ffffff0d;border-radius:12px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--utama);color:#fff;display:grid;place-items:center;font-weight:700}
.profil small{display:block;color:#64748b}
/* konten */
.isi{padding:0 28px 40px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 0}
.topbar h1{margin:0;font-size:22px}.topbar p{margin:2px 0 0;color:var(--abu)}
.aksi{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--garis);background:var(--kartu);color:var(--teks);cursor:pointer}
.btn:hover{border-color:var(--utama)}
.btn.utama{background:var(--utama);border-color:var(--utama);color:#fff;font-weight:600}
.btn.utama:hover{opacity:.9}
select.btn{padding-right:8px}
.grid{display:grid;gap:16px}
.kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.dua{grid-template-columns:2fr 1fr;margin-top:16px}
.kartu{background:var(--kartu);border:1px solid var(--garis);border-radius:16px;padding:20px;box-shadow:0 1px 2px #0000000a}
.kartu h3{margin:0;font-size:14px;color:var(--abu);font-weight:600}
.ikon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;float:right}
.nilai{font-size:26px;font-weight:700;margin:12px 0 6px;letter-spacing:-.5px}
.delta{font-size:12px;color:var(--abu)}
.naik{color:var(--hijau);font-weight:600}.turun{color:var(--merah);font-weight:600}
.judul{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.judul h2{margin:0;font-size:16px}
/* grafik */
.grafik{position:relative;height:210px;display:flex;align-items:flex-end;gap:14px;padding:0 4px 24px 4px}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--garis)}
.gl span{position:absolute;top:-8px;left:0;font-size:10px;color:var(--abu);background:var(--kartu);padding-right:4px}
.kol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative;z-index:1}
.kol b{width:40%;max-width:26px;border-radius:6px 6px 0 0;min-height:3px;transition:height .5s}
.kol em{position:absolute;bottom:-22px;font-style:normal;font-size:12px;color:var(--abu)}
.legenda{display:flex;gap:14px;color:var(--abu);font-size:12px}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
/* donat */
.donat{width:150px;height:150px;border-radius:50%;margin:6px auto 16px;display:grid;place-items:center}
.donat div{width:98px;height:98px;border-radius:50%;background:var(--kartu);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--abu)}
.donat strong{display:block;font-size:14px;color:var(--teks)}
.lk{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.lk i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px}
/* tabel */
.cari{padding:9px 12px;border-radius:10px;border:1px solid var(--garis);background:var(--bg);color:var(--teks);min-width:200px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--garis);background:transparent;color:var(--abu);cursor:pointer}
.chip.aktif{background:var(--utama2);color:var(--utama);border-color:var(--utama);font-weight:600}
.bungkus{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--abu);padding:10px 8px;border-bottom:1px solid var(--garis)}
td{padding:12px 8px;border-bottom:1px solid var(--garis)}
tr:last-child td{border-bottom:none}
.num{text-align:right}
.sel{display:flex;align-items:center;gap:12px}
.sel .ik{width:36px;height:36px;border-radius:10px;background:var(--utama2);display:grid;place-items:center}
.sel small{color:var(--abu);display:block}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge.masuk{background:#10b9811f;color:var(--hijau)}.badge.keluar{background:#f43f5e1f;color:var(--merah)}
.x{background:none;border:none;cursor:pointer;opacity:.5;font-size:15px}.x:hover{opacity:1}
.kosong{text-align:center;color:var(--abu);padding:26px}
/* modal */
dialog{border:none;border-radius:18px;padding:24px;width:min(420px,92vw);background:var(--kartu);color:var(--teks);box-shadow:0 20px 60px #00000055}
dialog::backdrop{background:#0f172a99}
dialog h2{margin:0 0 16px}
dialog label{display:block;font-size:12px;color:var(--abu);margin:12px 0 4px}
dialog input,dialog select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--garis);background:var(--bg);color:var(--teks)}
.baris{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#err{color:var(--merah);font-size:13px;min-height:16px;margin-top:10px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--sisi);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
#toast.tampil{opacity:1;transform:none}
.sembunyi{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:12px}.profil{display:none}nav{display:flex;gap:6px;overflow-x:auto}nav a{white-space:nowrap}.logo{padding-bottom:10px}.dua{grid-template-columns:1fr}.isi{padding:0 16px 40px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i>💼</i>Kasku</div>
    <nav>
      <a class="aktif" id="nav-dashboard" onclick="ganti('dashboard')">📊 Dashboard</a>
      <a id="nav-transaksi" onclick="ganti('transaksi')">🧾 Transaksi</a>
      <a class="mati">📑 Laporan <small>(segera)</small></a>
      <a class="mati">⚙️ Pengaturan</a>
    </nav>
    <div class="profil"><div class="avatar">P</div><div>Putri<small>Pemilik usaha</small></div></div>
  </aside>

  <div class="isi">
    <div class="topbar">
      <div><h1 id="judulHalaman">Dashboard</h1><p id="subjudul"></p></div>
      <div class="aksi">
        <select class="btn" id="periode" onchange="render()">
          <option value="semua">Semua waktu</option>
          <option value="bulan">Bulan ini</option>
        </select>
        <button class="btn" onclick="ekspor()">⬇ Ekspor CSV</button>
        <button class="btn" onclick="tema()" title="Ganti tema">🌓</button>
        <button class="btn utama" onclick="buka()">+ Transaksi baru</button>
      </div>
    </div>

    <div id="atas">
      <div class="grid kpi" id="kpi"></div>
      <div class="grid dua">
        <div class="kartu">
          <div class="judul"><h2>Arus kas 6 bulan terakhir</h2>
            <div class="legenda"><span><i style="background:var(--hijau)"></i>Pemasukan</span><span><i style="background:var(--merah)"></i>Pengeluaran</span></div></div>
          <div class="grafik" id="grafik"></div>
        </div>
        <div class="kartu">
          <div class="judul"><h2>Pengeluaran per kategori</h2></div>
          <div id="donat"></div>
        </div>
      </div>
    </div>

    <div class="kartu" style="margin-top:16px">
      <div class="judul">
        <h2 id="judulTabel">Transaksi terbaru</h2>
        <div class="aksi">
          <input class="cari" id="cari" placeholder="🔍 Cari transaksi..." oninput="render()">
          <button class="chip aktif" data-j="semua" onclick="filterJ(this)">Semua</button>
          <button class="chip" data-j="masuk" onclick="filterJ(this)">Masuk</button>
          <button class="chip" data-j="keluar" onclick="filterJ(this)">Keluar</button>
        </div>
      </div>
      <div class="bungkus"><table>
        <thead><tr><th>Transaksi</th><th>Tanggal</th><th>Jenis</th><th class="num">Jumlah</th><th></th></tr></thead>
        <tbody id="isiTabel"></tbody>
      </table></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <h2>Transaksi baru</h2>
  <label>Tanggal</label><input type="date" id="fTgl">
  <label>Keterangan</label><input id="fKet" placeholder="Contoh: Penjualan produk A">
  <label>Kategori</label>
  <select id="fKat"><option>Penjualan</option><option>Gaji</option><option>Sewa</option><option>Listrik & Air</option><option>Bahan Baku</option><option>Pemasaran</option><option>Lainnya</option></select>
  <label>Jenis</label>
  <select id="fJenis"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select>
  <label>Jumlah (Rp)</label><input type="number" id="fJumlah" min="1" placeholder="0">
  <div id="err"></div>
  <div class="baris"><button class="btn" onclick="dlg.close()">Batal</button><button class="btn utama" onclick="tambah()">Simpan</button></div>
</dialog>
<div id="toast"></div>

<script>
const KUNCI="dashboardAkuntansi";
const WARNA=["#4f46e5","#f43f5e","#f59e0b","#10b981","#06b6d4","#8b5cf6","#94a3b8"];
const EMOJI={"Penjualan":"🛍️","Gaji":"👥","Sewa":"🏠","Listrik & Air":"💡","Bahan Baku":"📦","Pemasaran":"📣","Lainnya":"🧾"};
const contoh=[
{id:1,tgl:"2026-05-03",ket:"Penjualan produk A",kat:"Penjualan",jenis:"masuk",jumlah:12500000},
{id:2,tgl:"2026-05-10",ket:"Sewa toko",kat:"Sewa",jenis:"keluar",jumlah:3000000},
{id:3,tgl:"2026-06-05",ket:"Penjualan produk B",kat:"Penjualan",jenis:"masuk",jumlah:15200000},
{id:4,tgl:"2026-06-12",ket:"Gaji karyawan",kat:"Gaji",jenis:"keluar",jumlah:6500000},
{id:5,tgl:"2026-07-02",ket:"Penjualan online",kat:"Penjualan",jenis:"masuk",jumlah:11800000},
{id:6,tgl:"2026-07-15",ket:"Bahan baku",kat:"Bahan Baku",jenis:"keluar",jumlah:4200000},
{id:7,tgl:"2026-08-04",ket:"Penjualan grosir",kat:"Penjualan",jenis:"masuk",jumlah:18900000},
{id:8,tgl:"2026-08-20",ket:"Iklan media sosial",kat:"Pemasaran",jenis:"keluar",jumlah:1500000},
{id:9,tgl:"2026-09-06",ket:"Penjualan produk A",kat:"Penjualan",jenis:"masuk",jumlah:14300000},
{id:10,tgl:"2026-09-18",ket:"Listrik dan air",kat:"Listrik & Air",jenis:"keluar",jumlah:950000},
{id:11,tgl:"2026-10-01",ket:"Penjualan harian",kat:"Penjualan",jenis:"masuk",jumlah:5400000},
{id:12,tgl:"2026-10-02",ket:"Gaji karyawan",kat:"Gaji",jenis:"keluar",jumlah:6500000}];

let data=muat(),tampilan="dashboard",jenisAktif="semua";
const $=id=>document.getElementById(id);
const dlg=$("dlg");

function muat(){try{let s=localStorage.getItem(KUNCI);if(s)return JSON.parse(s)}catch(e){}return contoh}
function simpan(){try{localStorage.setItem(KUNCI,JSON.stringify(data))}catch(e){}}
function rp(n){return "Rp "+Math.abs(Math.round(n)).toLocaleString("id-ID")}
function singkat(n){return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+" jt":n>=1e3?Math.round(n/1e3)+" rb":String(n)}
function aman(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function kb(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function jumlahDari(arr,j){return arr.filter(d=>d.jenis===j).reduce((a,d)=>a+d.jumlah,0)}
function toast(t){let e=$("toast");e.innerText=t;e.classList.add("tampil");setTimeout(()=>e.classList.remove("tampil"),2200)}

function ganti(v){
  tampilan=v;
  $("nav-dashboard").classList.toggle("aktif",v==="dashboard");
  $("nav-transaksi").classList.toggle("aktif",v==="transaksi");
  $("atas").classList.toggle("sembunyi",v!=="dashboard");
  $("judulHalaman").innerText=v==="dashboard"?"Dashboard":"Transaksi";
  $("judulTabel").innerText=v==="dashboard"?"Transaksi terbaru":"Semua transaksi";
  render();
}
function filterJ(el){
  jenisAktif=el.dataset.j;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("aktif",c===el));
  render();
}

function render(){
  let now=new Date(),bulanIni=kb(now),bulanLalu=kb(new Date(now.getFullYear(),now.getMonth()-1,1));
  let mode=$("periode").value;
  let dp=data.filter(d=>mode==="semua"||d.tgl.startsWith(bulanIni));
  $("subjudul").innerText=(mode==="semua"?"Ringkasan semua waktu":"Ringkasan bulan ini")+" · "+dp.length+" transaksi";

  let masuk=jumlahDari(dp,"masuk"),keluar=jumlahDari(dp,"keluar"),laba=masuk-keluar;
  let margin=masuk>0?laba/masuk*100:0;

  // delta vs bulan lalu (hanya mode bulan ini)
  function delta(j,nilai){
    if(mode!=="bulan")return '<span class="delta">Semua waktu</span>';
    let lalu=jumlahDari(data.filter(d=>d.tgl.startsWith(bulanLalu)),j);
    if(lalu===0)return '<span class="delta">Belum ada data bulan lalu</span>';
    let p=(nilai-lalu)/lalu*100,baik=(j==="keluar")?p<=0:p>=0;
    return '<span class="'+(baik?"naik":"turun")+'">'+(p>=0?"▲ ":"▼ ")+Math.abs(p).toFixed(0)+'%</span> <span class="delta">vs bulan lalu</span>';
  }
  let kartu=[
    ["Total pemasukan","💰","#10b9811f",rp(masuk),delta("masuk",masuk),""],
    ["Total pengeluaran","💸","#f43f5e1f",rp(keluar),delta("keluar",keluar),""],
    ["Laba bersih","📈","#4f46e51f",(laba<0?"-":"")+rp(laba),'<span class="delta">'+(laba>=0?"Usaha untung":"Usaha rugi")+"</span>",laba>=0?"var(--hijau)":"var(--merah)"],
    ["Margin laba","🎯","#f59e0b1f",margin.toFixed(1)+"%",'<span class="delta">Laba dibanding pemasukan</span>',""]];
  $("kpi").innerHTML=kartu.map(k=>'<div class="kartu"><span class="ikon" style="background:'+k[2]+'">'+k[1]+'</span><h3>'+k[0]+'</h3><div class="nilai" style="color:'+(k[5]||"inherit")+'">'+k[3]+'</div>'+k[4]+'</div>').join("");

  // grafik 6 bulan
  let bln=[];
  for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1);bln.push({k:kb(d),l:d.toLocaleDateString("id-ID",{month:"short"}),masuk:0,keluar:0})}
  data.forEach(d=>bln.forEach(b=>{if(d.tgl.startsWith(b.k))b[d.jenis]+=d.jumlah}));
  let maks=Math.max(1,...bln.map(b=>Math.max(b.masuk,b.keluar)));
  let garis=[1,.75,.5,.25].map(f=>'<div class="gl" style="top:'+((1-f)*(100-0))*0.88+'%"><span>'+singkat(maks*f)+'</span></div>').join("");
  $("grafik").innerHTML=garis+bln.map(b=>'<div class="kol"><b style="height:'+(b.masuk/maks*88)+'%;background:var(--hijau)" title="Pemasukan '+rp(b.masuk)+'"></b><b style="height:'+(b.keluar/maks*88)+'%;background:var(--merah)" title="Pengeluaran '+rp(b.keluar)+'"></b><em>'+b.l+'</em></div>').join("");

  // donat kategori
  let pk={};dp.filter(d=>d.jenis==="keluar").forEach(d=>pk[d.kat]=(pk[d.kat]||0)+d.jumlah);
  let ks=Object.keys(pk).sort((a,b)=>pk[b]-pk[a]);
  if(ks.length===0){$("donat").innerHTML='<div class="kosong">Belum ada pengeluaran</div>'}
  else{
    let acc=0,seg=ks.map((k,i)=>{let a=acc/keluar*100;acc+=pk[k];return WARNA[i%WARNA.length]+" "+a+"% "+(acc/keluar*100)+"%"});
    $("donat").innerHTML='<div class="donat" style="background:conic-gradient('+seg.join(",")+')"><div><span><strong>'+singkat(keluar)+'</strong>total</span></div></div>'+
      ks.map((k,i)=>'<div class="lk"><span><i style="background:'+WARNA[i%WARNA.length]+'"></i>'+aman(k)+'</span><b>'+(pk[k]/keluar*100).toFixed(0)+'%</b></div>').join("");
  }

  // tabel
  let q=$("cari").value.trim().toLowerCase();
  let tampil=data.filter(d=>(jenisAktif==="semua"||d.jenis===jenisAktif)&&(q===""||(d.ket+" "+d.kat).toLowerCase().includes(q)))
    .sort((a,b)=>b.tgl.localeCompare(a.tgl));
  if(tampilan==="dashboard")tampil=tampil.slice(0,6);
  $("isiTabel").innerHTML=tampil.length===0?'<tr><td colspan="5" class="kosong">Tidak ada transaksi ditemukan</td></tr>':
    tampil.map(d=>'<tr><td><div class="sel"><div class="ik">'+(EMOJI[d.kat]||"🧾")+'</div><div>'+aman(d.ket)+'<small>'+aman(d.kat)+'</small></div></div></td>'+
    '<td>'+new Date(d.tgl+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})+'</td>'+
    '<td><span class="badge '+d.jenis+'">'+(d.jenis==="masuk"?"Pemasukan":"Pengeluaran")+'</span></td>'+
    '<td class="num" style="font-weight:600;color:var(--'+(d.jenis==="masuk"?"hijau":"merah")+')">'+(d.jenis==="keluar"?"-":"+")+rp(d.jumlah)+'</td>'+
    '<td class="num"><button class="x" onclick="hapus('+d.id+')" title="Hapus">🗑️</button></td></tr>').join("");
}

function buka(){$("fTgl").value=new Date().toISOString().slice(0,10);$("err").innerText="";dlg.showModal()}
function tambah(){
  let tgl=$("fTgl").value,ket=$("fKet").value.trim(),jumlah=Number($("fJumlah").value);
  if(tgl===""||ket===""||jumlah<=0){$("err").innerText="Lengkapi tanggal, keterangan, dan jumlah (lebih dari 0).";return}
  data.push({id:Date.now(),tgl:tgl,ket:ket,kat:$("fKat").value,jenis:$("fJenis").value,jumlah:jumlah});
  simpan();$("fKet").value="";$("fJumlah").value="";dlg.close();render();toast("Transaksi berhasil ditambahkan ✓");
}
function hapus(id){if(!confirm("Hapus transaksi ini?"))return;data=data.filter(d=>d.id!==id);simpan();render();toast("Transaksi dihapus")}
function ekspor(){
  let baris=["tanggal,keterangan,kategori,jenis,jumlah"].concat(data.map(d=>[d.tgl,'"'+d.ket.replace(/"/g,'""')+'"',d.kat.replace(/,/g," "),d.jenis,d.jumlah].join(",")));
  let a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([baris.join("\n")],{type:"text/csv"}));
  a.download="transaksi.csv";a.click();toast("File CSV diunduh");
}
function tema(){
  let g=document.documentElement.dataset.tema==="gelap";
  document.documentElement.dataset.tema=g?"":"gelap";
  try{localStorage.setItem("temaKasku",g?"":"gelap")}catch(e){}
}
try{document.documentElement.dataset.tema=localStorage.getItem("temaKasku")||""}catch(e){}
render();
</script>
</body>
</html>
