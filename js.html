<template id="t-m1">
<h2 class="lg"><small>Langkah 1</small>Baca</h2>
<p>Halaman web dibuat dari tiga bahasa yang tugasnya berbeda. Cara mengingatnya: HTML adalah kerangka rumah, CSS adalah cat dan tata ruangnya, JavaScript adalah listrik dan saklarnya.</p>
<table>
<thead><tr><th>Bahasa</th><th>Menjawab</th><th>Contoh</th></tr></thead>
<tbody>
<tr><td><b>HTML</b></td><td>Ada apa saja di halaman?</td><td><code>&lt;button&gt;</code> <code>&lt;table&gt;</code></td></tr>
<tr><td><b>CSS</b></td><td>Bagaimana tampilannya?</td><td><code>color: red;</code></td></tr>
<tr><td><b>JavaScript</b></td><td>Apa yang terjadi saat diklik, dan bagaimana data diolah?</td><td><code>addEventListener</code></td></tr>
</tbody></table>
<div class="catatan"><b>Beda dengan PHP</b><p>PHP berjalan di server dan hasilnya berupa HTML yang dikirim ke browser. JavaScript berjalan di browser setelah halaman sampai, jadi bisa bereaksi pada klik tanpa memuat ulang halaman.</p></div>
<p>Penghubung ketiganya adalah <code>id</code> dan <code>class</code>. HTML memberi nama pada elemen, CSS dan JavaScript memakai nama itu untuk menunjuknya.</p>
<p>Di file sungguhan, JavaScript biasanya dipasang di akhir halaman, atau dengan <code>defer</code> supaya elemen sudah ada saat kode berjalan:</p>
<pre><code>&lt;script src="script.js" defer&gt;&lt;/script&gt;</code></pre>

<h2 class="lg"><small>Langkah 2</small>Coba sendiri</h2>
<p>Editor di bawah berisi halaman kecil lengkap dengan HTML, CSS, dan JavaScript. Hasilnya tampil langsung di bawah editor. Klik tombol di pratinjau, lalu ubah kodenya.</p>
<textarea class="lat" data-mode="html">
<style>
  h1 { color: #0b7a8f; }
  button { padding: 8px 14px; }
</style>

<h1 id="judul">Halo, dunia</h1>
<button id="tombol">Klik aku</button>

<script>
  const judul = document.getElementById("judul");
  const tombol = document.getElementById("tombol");

  tombol.addEventListener("click", function () {
    judul.textContent = "Tombol sudah diklik";
  });
</script>
</textarea>
<h3>Eksperimen</h3>
<ul>
<li>Ganti <code>#0b7a8f</code> dengan <code>tomato</code>, lalu tekan Jalankan.</li>
<li>Ubah teks di dalam tanda kutip pada <code>textContent</code>.</li>
<li>Tambahkan tombol kedua dengan id lain dan buat klik-nya mengubah judul menjadi teks berbeda.</li>
</ul>
<div class="catatan"><b>Bila halaman macet</b><p>Perulangan yang tidak pernah berhenti bisa membekukan halaman ini. Muat ulang halaman bila itu terjadi.</p></div>
</template>

<template id="t-m2">
<h2 class="lg"><small>Langkah 1</small>Baca</h2>
<p>Variabel adalah kotak bernama untuk menyimpan nilai. Di JavaScript tidak ada tanda <code>$</code>, tetapi kamu harus memilih <code>const</code> atau <code>let</code> saat membuatnya.</p>
<div class="banding">
<div><span class="lbl php">PHP</span><pre><code>$nama = "Rina";
$umur = 21;
echo "Halo " . $nama;</code></pre></div>
<div><span class="lbl js">JAVASCRIPT</span><pre><code>const nama = "Rina";
let umur = 21;
console.log("Halo " + nama);</code></pre></div>
</div>
<ul>
<li><code>const</code>: nilainya tidak boleh diganti. Jadikan ini pilihan awal.</li>
<li><code>let</code>: nilainya boleh berubah. Pakai bila memang perlu diubah.</li>
<li><code>var</code>: cara lama. Sebaiknya dihindari.</li>
</ul>
<p>Untuk menyisipkan variabel ke dalam teks, pakai backtick dan <code>${...}</code>. Ini padanan <code>"Halo $nama"</code> di PHP.</p>
<table>
<thead><tr><th>Tipe</th><th>Contoh</th><th>Catatan</th></tr></thead>
<tbody>
<tr><td>string</td><td><code>"teks"</code></td><td>Boleh tanda kutip ganda, tunggal, atau backtick</td></tr>
<tr><td>number</td><td><code>42</code> <code>3.14</code></td><td>Bilangan bulat dan desimal sama-sama number</td></tr>
<tr><td>boolean</td><td><code>true</code> <code>false</code></td><td>Huruf kecil semua</td></tr>
<tr><td>null / undefined</td><td><code>null</code></td><td><code>undefined</code> berarti belum diberi nilai</td></tr>
<tr><td>object / array</td><td><code>{ a: 1 }</code> <code>[1, 2]</code></td><td>Array termasuk object. Object mirip array asosiatif PHP</td></tr>
</tbody></table>

<h2 class="lg"><small>Langkah 2</small>Coba sendiri</h2>
<p>Tebak dulu hasil tiap baris sebelum menekan Jalankan, lalu cocokkan.</p>
<textarea class="lat" data-mode="js">
const nama = "Rina";
let umur = 21;
umur = umur + 1;

console.log(nama, umur);
console.log(typeof nama);
console.log(typeof umur);
console.log(`Halo, ${nama}! Tahun depan kamu ${umur + 1}.`);

// Tiga hal yang sering mengejutkan
console.log("5" + 3);
console.log("5" - 3);
console.log(0.1 + 0.2);
</textarea>
<p>Satu lagi, tentang nilai kosong dan tipe object:</p>
<textarea class="lat" data-mode="js">
let a;
const b = null;
const orang = { nama: "Rina", umur: 21 };

console.log(a);
console.log(b);
console.log(orang.nama);
console.log(orang.alamat);
console.log(typeof [1, 2, 3]);
console.log(Array.isArray([1, 2, 3]));
</textarea>
<div class="catatan"><b>Beda dengan PHP</b><p>Tanda <code>+</code> di JavaScript menjumlahkan angka sekaligus menggabungkan teks. PHP memakai <code>.</code> untuk menggabungkan. Saat salah satu sisinya teks, hasilnya digabung: <code>"5" + 3</code> menjadi <code>"53"</code>.</p></div>
</template>

<template id="t-m3">
<h2 class="lg"><small>Langkah 1</small>Baca</h2>
<p>Kondisi memilih jalan, perulangan mengulang pekerjaan. Bentuknya mirip PHP, dengan beberapa perbedaan kecil.</p>
<div class="banding">
<div><span class="lbl php">PHP</span><pre><code>if ($n >= 80) {
} elseif ($n >= 70) {
} else {
}

foreach ($buah as $b) {
}</code></pre></div>
<div><span class="lbl js">JAVASCRIPT</span><pre><code>if (n >= 80) {
} else if (n >= 70) {
} else {
}

for (const b of buah) {
}</code></pre></div>
</div>
<p>Untuk membandingkan, pakai <code>===</code> (sama nilai dan tipe), bukan <code>==</code>. Operator <code>==</code> mengubah tipe diam-diam dan sering memberi hasil tak terduga.</p>
<p>Bentuk singkat untuk memilih antara dua nilai disebut ternary: <code>nilai &gt;= 75 ? "Lulus" : "Remedi"</code>.</p>
<div class="catatan"><b>Beda dengan PHP</b><p>Nilai yang dianggap salah (falsy) di JavaScript: <code>false</code>, <code>0</code>, <code>""</code>, <code>null</code>, <code>undefined</code>, <code>NaN</code>. Teks <code>"0"</code> dan array kosong <code>[]</code> dianggap benar. Di PHP keduanya dianggap salah.</p></div>

<h2 class="lg"><small>Langkah 2</small>Coba sendiri</h2>
<textarea class="lat" data-mode="js">
const nilai = 74;

if (nilai >= 80) {
  console.log("A");

<template id="t-m4">
<h2 class="lg"><small>Langkah 1</small>Baca</h2>
<p>Fungsi adalah blok kode yang diberi nama supaya bisa dipakai berulang. Ada dua cara menulisnya.</p>
<div class="banding">
<div><span class="lbl php">PHP</span><pre><code>function tambah($a, $b) {
  return $a + $b;
}

$kali = fn($a, $b) => $a * $b;</code></pre></div>
<div><span class="lbl js">JAVASCRIPT</span><pre><code>function tambah(a, b) {
  return a + b;
}

const kali = (a, b) => a * b;</code></pre></div>
</div>
<ul>
<li><b>Deklarasi biasa</b>: <code>function nama() {}</code>.</li>
<li><b>Arrow function</b>: <code>(a, b) =&gt; a * b</code>. Bila hanya satu ekspresi, <code>return</code> boleh dihilangkan. Ini bentuk yang paling sering muncul di <code>map</code>, <code>filter</code>, dan event.</li>
<li><b>Parameter bawaan</b>: <code>function sapa(nama = "teman")</code> dipakai bila argumen tidak diberikan.</li>
<li>Fungsi tanpa <code>return</code> menghasilkan <code>undefined</code>.</li>
</ul>
<p>Hal yang membuat JavaScript terasa berbeda: fungsi adalah nilai biasa. Fungsi boleh disimpan di variabel dan dikirim ke fungsi lain. Fungsi yang dikirim itu sering disebut <i>callback</i>.</p>

console.log(tambah(2, 3));
console.log(kali(4, 5));
console.log(sapa());
console.log(sapa("Rina"));

<h3>Proyek penutup: pencatat tugas</h3>
<p>Ini semua pola dari modul sebelumnya dalam satu aplikasi kecil: muat, simpan, tampilkan, dengarkan event. Baca urutannya dari atas, lalu ubah-ubah.</p>
<textarea class="lat" data-mode="html">
<style>
  body { font-family: system-ui, sans-serif; }
  li { margin: 4px 0; cursor: pointer; }
  .selesai { text-decoration: line-through; color: #777; }
</style>

<h2>Tugas</h2>
<input id="isi" placeholder="Tugas baru">
<button id="tambah">Tambah</button>
<ul id="daftar"></ul>

<script>
  const KUNCI = "tugas";

  // 1. Muat data (aman bila kosong atau rusak)
  function muat() {
    try { return JSON.parse(localStorage.getItem(KUNCI)) || []; }
    catch (e) { return []; }
  }
  let tugas = muat();

  // 2. Simpan data
  function simpan() {
    localStorage.setItem(KUNCI, JSON.stringify(tugas));
  }

  // 3. Tampilkan data ke halaman
  function render() {
    const daftar = document.getElementById("daftar");
    daftar.innerHTML = "";
    tugas.forEach((t) => {
      const li = document.createElement("li");
      li.textContent = t.teks;
      li.className = t.selesai ? "selesai" : "";
      li.addEventListener("click", () => {
        t.selesai = !t.selesai;
        simpan();
        render();
      });
      daftar.appendChild(li);
    });
  }

  // 4. Dengarkan event, ubah data, simpan, tampilkan ulang
  document.getElementById("tambah").addEventListener("click", () => {
    const isi = document.getElementById("isi");
    if (isi.value.trim() === "") return;
    tugas.push({ teks: isi.value.trim(), selesai: false });
    simpan();
    render();
    isi.value = "";
  });

  render();
</script>
</textarea>

/* ---------- Penjalan kode (iframe terisolasi) ---------- */
function hookFn(id){
  var hasil=[],galat=null;
  function fmt(x){
    if(typeof x==="string")return x;
    if(x instanceof Error)return x.name+": "+x.message;
    if(typeof x==="function")return String(x);
    if(x===undefined)return "undefined";
    if(typeof x==="number"||typeof x==="boolean"||typeof x==="bigint")return String(x);
    try{var s=JSON.stringify(x);return s===undefined?String(x):s}catch(e){return String(x)}
  }
  function kirim(t,v,extra){try{var m={lat:id,t:t,v:v};if(extra)m.galat=extra;parent.postMessage(m,"*")}catch(e){}}
  ["log","info","warn","error"].forEach(function(k){
    console[k]=function(){kirim(k==="info"?"log":k,[].slice.call(arguments).map(fmt).join(" "))};
  });
  window.addEventListener("error",function(e){galat=e.message||"Error";kirim("error",galat)});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;kirim("error","Promise ditolak: "+(r&&r.message?r.message:fmt(r)))});
  window.cek=function(n,f){var ok=false,p="";try{ok=!!f()}catch(e){p=e.name+": "+e.message}hasil.push({n:n,ok:ok,p:p})};
  window.selesai=function(){kirim("tes",hasil,galat||"")};
  try{localStorage.getItem("x")}catch(e){
    var m={};
    try{Object.defineProperty(window,"localStorage",{configurable:true,value:{
      getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null},
      setItem:function(k,v){m[k]=String(v)},
      removeItem:function(k){delete m[k]},
      clear:function(){m={}}}})}catch(e2){}
  }
}
function bangun(kode,mode,id,tes){
  const hook="<script>("+hookFn.toString()+")("+JSON.stringify(id)+");<\/script>";
  const tesTag=tes?"<script>try{"+tes+"}catch(e){cek('Kode pengujian berjalan',function(){return false})}selesai();<\/script>":"";
  const kepala='<!doctype html><html><head><meta charset="utf-8">';
  if(mode==="html")return kepala+"<style>body{font-family:system-ui,sans-serif;margin:12px;color:#13222c;background:#fff}</style>"+hook+"</head><body>"+kode+tesTag+"</body></html>";
  return kepala+hook+"</head><body><script>"+kode+"\n<\/script>"+tesTag+"</body></html>";
}

const labs={};
let seq=0;
window.addEventListener("message",function(e){
  const d=e.data;if(!d||typeof d!=="object"||!d.lat)return;
  const L=labs[d.lat];if(!L||e.source!==L.ifr.contentWindow)return;
  L.onMsg(d);
});

function buatLab(o){
  const id="lab"+(++seq),el=h("div","lab");
  const label=o.mode==="html"?"HTML + CSS + JS":"JavaScript";
  el.innerHTML='<div class="lab-bar"><span class="tagbhs">'+label+'</span><span class="sp"></span><span class="tip">Ctrl+Enter untuk menjalankan</span>'+
    '<button type="button" class="btn kecil" data-a="reset">Kembalikan awal</button>'+
    '<button type="button" class="btn utama kecil" data-a="run">'+(o.tes?"Periksa jawaban":"Jalankan")+'</button></div>'+
    '<textarea class="kode" id="'+id+'-kode" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor kode"></textarea>'+
    '<iframe '+(o.mode==="html"?'class="prev"':'hidden')+' sandbox="allow-scripts" title="'+(o.mode==="html"?"Pratinjau hasil":"Penjalan kode")+'"></iframe>'+
    '<div class="out" aria-live="polite"></div>';
  const ta=$("textarea",el),ifr=$("iframe",el),out=$(".out",el);
  const awal=o.kode.replace(/^\n/,"").replace(/\s+$/,"");
  ta.value=awal;
  ta.rows=Math.max(5,Math.min(24,awal.split("\n").length+1));
  let timer=0,sudah=false,logEl=null,gagalKe=0;

  function kosong(){out.innerHTML='<span class="kosong">'+(o.tes?"Tekan Periksa jawaban untuk menguji kodemu.":(o.mode==="html"?"Pesan console akan muncul di sini.":"Tekan Jalankan untuk melihat hasil."))+'</span>'}
  function tampilTes(d){
    const list=d.v||[],lulus=list.length>0&&list.every(x=>x.ok)&&!d.galat;
    const ringkas=h("p","ringkas "+(lulus?"ok":"gagal"),lulus?"Semua pengujian lulus.":(list.filter(x=>x.ok).length+" dari "+list.length+" pengujian lulus."));
    const ul=h("ul","hasiltes");
    list.forEach(x=>{ul.append(h("li",null,'<span class="m '+(x.ok?"ok":"gagal")+'">'+(x.ok?"✓":"✗")+'</span><span>'+esc(x.n)+(x.p?'<small>'+esc(x.p)+'</small>':'')+'</span>'))});
    out.prepend(ul);out.prepend(ringkas);
    if(lulus)gagalKe=0;else gagalKe++;
    if(o.onHasil)o.onHasil(lulus,gagalKe);
  }
  function jalan(){
    out.innerHTML='<div class="log"></div>';logEl=$(".log",out);sudah=false;clearTimeout(timer);
    ifr.srcdoc=bangun(ta.value,o.mode,id,o.tes);
    if(o.tes){timer=setTimeout(()=>{if(!sudah){const p=h("p","ringkas gagal","Tidak ada respons dari kode. Periksa apakah ada perulangan yang tidak pernah berhenti, lalu muat ulang halaman.");out.prepend(p)}},6000)}
    else if(o.mode==="js"){timer=setTimeout(()=>{if(!logEl.childNodes.length)out.innerHTML='<span class="kosong">Kode berjalan tanpa keluaran. Gunakan console.log untuk menampilkan nilai.</span>'},1200)}
  }
  labs[id]={ifr:ifr,onMsg:function(d){
    if(d.t==="tes"){sudah=true;clearTimeout(timer);tampilTes(d);return}
    if(!logEl||!logEl.isConnected){out.innerHTML='<div class="log"></div>';logEl=$(".log",out)}
    logEl.append(h("div","l "+d.t,esc(d.v)));
  }};
  el.addEventListener("click",ev=>{
    const b=ev.target.closest("button[data-a]");if(!b)return;
    if(b.dataset.a==="run")jalan();
    else{ta.value=awal;clearTimeout(timer);kosong()}
  });
  let bebas=false;
  ta.addEventListener("keydown",ev=>{
    if((ev.ctrlKey||ev.metaKey)&&ev.key==="Enter"){ev.preventDefault();jalan();return}
    if(ev.key==="Escape"){bebas=true;return}
    if(ev.key==="Tab"&&!ev.shiftKey&&!bebas){ev.preventDefault();ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end")}
    else if(ev.key!=="Tab"&&ev.key!=="Shift")bebas=false;
  });
  ta.addEventListener("blur",()=>{bebas=false});
  kosong();
  if(!o.tes)setTimeout(jalan,0);
  return el;
}

        if(terjawab===m.kuis.length){
          skor.textContent="Skor kamu: "+benar+" dari "+m.kuis.length+(benar>=2?". Kuis lulus.":". Ulangi kuis untuk lulus.");
          if(benar>s.kuis){s.kuis=benar;simpanS()}
          perbaruiNav();
          const u=h("button","btn kecil","Ulangi kuis");u.type="button";
          u.addEventListener("click",()=>box.replaceWith(buatKuis(m)));
          skor.after(u);
        }
      });
      op.append(b);
    });
    d.append(op,pj);box.append(d);
  });
  box.append(skor);
  return box;
}

function buatTantangan(m){
  const c=m.tantangan,s=st(m.id),box=h("section","blok");
  box.append(judulLangkah(4,"Tantangan"));
  const jd=h("p",null,"<b>"+c.judul+".</b> "+c.perintah+(s.tan?'<span class="lulus">SUDAH LULUS</span>':""));
  box.append(jd);
  const kunciBox=h("details","kunci");kunciBox.hidden=true;
  kunciBox.innerHTML="<summary>Lihat contoh jawaban</summary><pre><code></code></pre>";
  $("code",kunciBox).textContent=c.kunci;
  const lab=buatLab({kode:c.mulai,mode:c.mode,tes:c.tes,onHasil:function(lulus,gagal){
    if(lulus){
      if(!s.tan){s.tan=true;simpanS()}
      if(!$(".lulus",jd))jd.append(h("span","lulus","LULUS"));
      perbaruiNav();
    }else if(gagal>=2){kunciBox.hidden=false}
  }});
  box.append(lab);
  const pt=h("p","petunjuk");pt.hidden=true;pt.innerHTML="<b>Petunjuk:</b> "+c.petunjuk;
  const bp=h("button","btn kecil","Tampilkan petunjuk");bp.type="button";
  bp.addEventListener("click",()=>{pt.hidden=!pt.hidden;bp.textContent=pt.hidden?"Tampilkan petunjuk":"Sembunyikan petunjuk"});
  box.append(bp,pt,kunciBox);
  return box;
}

/* ---------- Tampilan ---------- */
let aktif="home";
function tampil(id){
  aktif=id;S._akhir=id;simpanS();
  Object.keys(labs).forEach(k=>delete labs[k]);
  const main=$("#main");main.innerHTML="";
  if(id==="home")tampilHome(main);
  else if(id==="kamus")tampilKamus(main);
  else tampilModul(main,id);
  perbaruiNav();
  window.scrollTo(0,0);
}

function tampilModul(main,id){
  const idx=MODUL.findIndex(x=>x.id===id),m=MODUL[idx];
  const kepala=h("header","kepala");
  kepala.innerHTML='<div class="nomor" aria-hidden="true">'+String(idx+1).padStart(2,"0")+'</div><div style="flex:1;min-width:min(100%,260px)"><p class="eyebrow">Modul '+(idx+1)+' dari '+MODUL.length+' · '+m.waktu+'</p><h1>'+m.judul+'</h1></div>';
  main.append(kepala,h("p","tujuan",m.tujuan));
  const isi=h("section","isi");
  isi.append(document.getElementById("t-"+id).content.cloneNode(true));
  main.append(isi);
  $$("textarea.lat",isi).forEach(ta=>ta.replaceWith(buatLab({kode:ta.value,mode:ta.dataset.mode||"js"})));
  $$("table",isi).forEach(t=>{const g=h("div","gulung");t.replaceWith(g);g.append(t)});
  main.append(buatKuis(m),buatTantangan(m));
  const kaki=h("div","kaki");
  const prev=idx>0?MODUL[idx-1]:null,next=idx<MODUL.length-1?MODUL[idx+1]:null;
  const bp=h("button","btn",prev?"← "+prev.judul:"← Beranda");bp.type="button";bp.addEventListener("click",()=>tampil(prev?prev.id:"home"));
  const bn=h("button","btn utama",next?next.judul+" →":"Buka kamus fungsi →");bn.type="button";bn.addEventListener("click",()=>tampil(next?next.id:"kamus"));
  kaki.append(bp,bn);main.append(kaki);
}

function tampilHome(main){
  const hero=h("header","hero");
  hero.innerHTML='<p class="eyebrow">7 modul · sekitar 3 jam total</p><h1>Belajar JavaScript lewat kode yang bisa kamu ubah sendiri</h1><p class="tujuan">Dibuat untuk yang sudah pernah menyentuh PHP tetapi masih pemula di JavaScript. Tiap modul menyorot apa yang sama dan apa yang berbeda dari PHP, dan semua contoh kode di sini bisa kamu jalankan langsung.</p>';
  main.append(hero);
  main.append(h("h2","lg","<small>Cara belajar</small>Empat langkah di setiap modul"));
  main.append(h("ol","langkah-list",
    "<li><b>Baca</b>Penjelasan singkat dan perbandingan dengan PHP.</li>"+
    "<li><b>Coba sendiri</b>Ubah kode di editor, lalu lihat hasilnya langsung.</li>"+
    "<li><b>Kuis</b>Tiga soal pilihan ganda dengan penjelasan di tiap jawaban.</li>"+
    "<li><b>Tantangan</b>Tulis kode sendiri. Diperiksa otomatis dengan beberapa kasus uji.</li>"));
  main.append(h("p",null,"Saran jadwal: satu modul per hari, 20 sampai 35 menit. Modul dianggap selesai bila kuis lulus dan tantangan lulus. Kemajuanmu tersimpan di browser ini."));
  const lanjut=MODUL.find(m=>!selesaiModul(m.id));
  const bm=h("button","btn utama",lanjut?(MODUL.some(m=>selesaiModul(m.id))?"Lanjutkan: ":"Mulai: ")+lanjut.judul:"Buka kamus fungsi");bm.type="button";
  bm.addEventListener("click",()=>tampil(lanjut?lanjut.id:"kamus"));
  main.append(bm);

  main.append(h("h2","lg","<small>Peta cepat</small>PHP ke JavaScript"));
  const t=h("table");t.innerHTML="<thead><tr><th>PHP</th><th>JavaScript</th></tr></thead><tbody>"+PETA.map(r=>"<tr><td><code>"+esc(r[0])+"</code></td><td><code>"+esc(r[1])+"</code></td></tr>").join("")+"</tbody>";
  const g=h("div","gulung");g.append(t);main.append(g);

  main.append(h("h2","lg","<small>Daftar modul</small>Semua modul"));
  const grid=h("div","kartu-modul");
  MODUL.forEach((m,i)=>{
    const b=h("button","km");b.type="button";
    const s=st(m.id);
    b.innerHTML='<span class="k1">MODUL '+(i+1)+' · '+m.waktu+'</span><span class="k2">'+m.judul+'</span><span class="k3">'+(selesaiModul(m.id)?"Selesai":"Kuis "+(s.kuis>=2?"lulus":"belum")+" · Tantangan "+(s.tan?"lulus":"belum"))+'</span>';
    b.addEventListener("click",()=>tampil(m.id));grid.append(b);
  });
  main.append(grid);
  main.append(h("div","catatan","<b>Setelah modul 7</b><p>Buka lagi kode Kasku dan cari fungsi <code>muat()</code>, <code>simpan()</code>, dan <code>render()</code>. Kamu sudah mengenali pola di baliknya.</p>"));
}

function tampilKamus(main){
  const hero=h("header","hero");
  hero.innerHTML='<p class="eyebrow">Referensi</p><h1>Kamus fungsi</h1><p class="tujuan">Fungsi yang paling sering dipakai, lengkap dengan contoh dan padanannya di PHP.</p>';
  main.append(hero);
  const cari=h("input","cari");cari.id="cariKamus";cari.type="search";cari.placeholder="Cari fungsi, misalnya filter atau JSON";cari.setAttribute("aria-label","Cari fungsi");
  const bungkusCari=h("div");bungkusCari.append(cari);main.append(bungkusCari);
  const kats=["Semua","DOM","Array","Teks","Angka","Lain-lain"];let kat="Semua";
  const chips=h("div","chips");
  kats.forEach(k=>{const c=h("button","chip",k);c.type="button";c.setAttribute("aria-pressed",k===kat?"true":"false");
    c.addEventListener("click",()=>{kat=k;$$(".chip",chips).forEach(x=>x.setAttribute("aria-pressed",x===c?"true":"false"));isi()});chips.append(c)});
  main.append(chips);
  const daftar=h("div","kamus");main.append(daftar);
  function isi(){
    const q=cari.value.trim().toLowerCase();daftar.innerHTML="";let n=0;
    KAMUS.forEach(r=>{
      if(kat!=="Semua"&&r[0]!==kat)return;
      if(q&&!(r[1]+" "+r[2]+" "+r[4]).toLowerCase().includes(q))return;
      n++;
      const it=h("div","ki");
      const kiri=h("div");kiri.append(h("span","nm",esc(r[1])),h("span","kt",r[0]));
      const kanan=h("div");kanan.append(h("p",null,esc(r[2])));
      const pre=h("pre");const code=h("code");code.textContent=r[3];pre.append(code);kanan.append(pre);
      if(r[4])kanan.append(h("p","ph","Di PHP: <code>"+esc(r[4])+"</code>"));
      it.append(kiri,kanan);daftar.append(it);
    });
    if(!n)daftar.append(h("p",null,"Tidak ada fungsi yang cocok. Coba kata lain."));
  }
  cari.addEventListener("input",isi);isi();
}

/* ---------- Menu ---------- */
function bangunNav(){
  const w=$("#daftarNav");w.innerHTML="";
  function item(id,no,judul,titik){
    const b=h("button","ni");b.type="button";b.dataset.id=id;
    b.innerHTML='<span class="no">'+no+'</span><span class="jd">'+judul+'</span>'+(titik?'<span class="st" aria-hidden="true"><i class="pt" title="Kuis"></i><i class="pt" title="Tantangan"></i></span>':"");
    b.addEventListener("click",()=>tampil(id));w.append(b);
  }
  item("home","~","Beranda",false);
  w.append(h("hr","pisah"));
  MODUL.forEach((m,i)=>item(m.id,String(i+1),m.judul,true));
  w.append(h("hr","pisah"));
  item("kamus","A–Z","Kamus fungsi",false);
}
function perbaruiNav(){
  let total=0;
  MODUL.forEach(m=>{const s=st(m.id);total+=(s.kuis>=2?.5:0)+(s.tan?.5:0)});
  const sel=MODUL.filter(m=>selesaiModul(m.id)).length;
  $("#kemTeks").textContent=sel+" dari "+MODUL.length+" modul selesai";
  $("#kemBar").style.width=Math.round(total/MODUL.length*100)+"%";
  $$(".ni").forEach(b=>{
    if(b.dataset.id===aktif)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
    const s=S[b.dataset.id];const pts=$$(".pt",b);
    if(pts.length){pts[0].classList.toggle("ya",!!s&&s.kuis>=2);pts[1].classList.toggle("ya",!!s&&!!s.tan)}
  });
}

/* ---------- Mulai ---------- */
bangunNav();
let awal="home";
try{const hs=(location.hash||"").slice(1);if(hs&&(MODUL.some(m=>m.id===hs)||hs==="kamus"||hs==="home"))awal=hs;
 else if(S._akhir&&(MODUL.some(m=>m.id===S._akhir)||S._akhir==="kamus"))awal=S._akhir}catch(e){}
tampil(awal);
})();
</script>
