<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haha, halo adik</title>
  <style>
    /* ===== CSS: mengatur tampilan ===== */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
    }
    .kartu {
      background: white;
      padding: 28px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus, select:focus { border-color: #667eea; outline: none; }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #5a67d8; }
    .reset { background: #aaa; }
    .reset:hover { background: #888; }
    .hasil { font-weight: bold; min-height: 24px; margin-top: 16px; }
    .bar-luar { background: #eee; border-radius: 10px; height: 14px; margin-top: 12px; overflow: hidden; }
    .bar { height: 100%; width: 0%; background: green; transition: width 0.5s, background 0.5s; }
    .info { font-size: 13px; color: #666; margin-top: 6px; }
    .baris { text-align: left; font-size: 14px; margin-top: 12px; }
    .baris input[type="range"] { padding: 0; border: none; }
    .nilaiGeser { float: right; font-weight: bold; color: #667eea; }
    .bobot { color: #999; font-size: 12px; }
  </style>
</head>
<body>

  <!-- ===== KARTU 1: sapaan ===== -->
  <div class="kartu">
    <h2>Haha, halo adik🚀</h2>

    <input id="kolomNama" placeholder="Ketik namamu">
    <input id="kolomSemester" type="number" placeholder="Semester (1-14)">
    <button onclick="sapa()">Klik aku</button>
    <button class="reset" onclick="ulang()">Reset</button>

    <p id="hasil" class="hasil"></p>
    <div class="bar-luar"><div id="bar" class="bar"></div></div>
    <p id="info" class="info"></p>
  </div>

  <!-- ===== KARTU 2: penilai masakan Suki Pedas Eka ===== -->
  <div class="kartu">
    <h2>Penilai Suki Pedas Eka 🍲🌶️</h2>
    <p class="info">Geser tiap slider untuk memberi nilai 1-10</p>

    <!-- Slider dibuat otomatis oleh JavaScript -->
    <div id="daftarNilai"></div>

    <button onclick="hitungSuki()">Hitung nilai akhir</button>
    <button class="reset" onclick="ulangSuki()">Reset</button>

    <p id="hasilSuki" class="hasil"></p>
    <div class="bar-luar"><div id="barSuki" class="bar"></div></div>
    <p id="infoSuki" class="info"></p>
  </div>

  <!-- ===== JavaScript: membuat halaman interaktif ===== -->
  <script>
    // ---------- BAGIAN 1: sapaan ----------
    let jumlahKlik = 0;

    function sapa() {
      let nama = document.getElementById("kolomNama").value.trim();
      let semester = Number(document.getElementById("kolomSemester").value);
      let hasil = document.getElementById("hasil");
      let bar = document.getElementById("bar");

      if (nama === "" || semester < 1 || semester > 14) {
        hasil.innerText = "Isi nama dan semester (1-14) dengan benar ya!";
        hasil.style.color = "black";
        return;
      }

      jumlahKlik = jumlahKlik + 1;

      let pesan = "Halo, " + nama + "! Kamu semester " + semester + ". ";
      let warna;
      if (semester >= 7) {
        pesan = pesan + "Semangat skripsinya! 💪";
        warna = "red";
      } else {
        pesan = pesan + "Masih santai, nikmati dulu! 😄";
        warna = "green";
      }

      hasil.innerText = pesan;
      hasil.style.color = warna;

      let persen = Math.min((semester / 8) * 100, 100);
      bar.style.width = persen + "%";
      bar.style.background = warna;

      document.getElementById("info").innerText =
        "Tombol sudah diklik " + jumlahKlik + " kali";
    }

    function ulang() {
      document.getElementById("kolomNama").value = "";
      document.getElementById("kolomSemester").value = "";
      document.getElementById("hasil").innerText = "";
      document.getElementById("bar").style.width = "0%";
      document.getElementById("info").innerText = "";
      jumlahKlik = 0;
    }

    // ---------- BAGIAN 2: penilai Suki Pedas Eka ----------

    // Array berisi objek: tiap kriteria punya nama dan bobot (pentingnya, total 100)
    let kriteria = [
      { nama: "Rasa kuah",      bobot: 30 },
      { nama: "Level pedas",    bobot: 20 },
      { nama: "Isian & bahan",  bobot: 20 },
      { nama: "Kesegaran",      bobot: 15 },
      { nama: "Tampilan",       bobot: 15 }
    ];

    // Perulangan: bikin slider untuk tiap kriteria
    let htmlNilai = "";
    kriteria.forEach(function (k, i) {
      htmlNilai = htmlNilai +
        '<div class="baris">' + k.nama +
        ' <span class="bobot">(bobot ' + k.bobot + '%)</span>' +
        '<span class="nilaiGeser" id="angka' + i + '">5</span>' +
        '<input type="range" id="geser' + i + '" min="1" max="10" value="5" ' +
        'oninput="document.getElementById(\'angka' + i + '\').innerText = this.value">' +
        "</div>";
    });
    document.getElementById("daftarNilai").innerHTML = htmlNilai;

    function hitungSuki() {
      let jumlah = 0;      // jumlah (nilai x bobot)
      let totalBobot = 0;

      for (let i = 0; i < kriteria.length; i++) {
        let nilai = Number(document.getElementById("geser" + i).value);
        jumlah = jumlah + nilai * kriteria[i].bobot;
        totalBobot = totalBobot + kriteria[i].bobot;
      }

      // Rata-rata berbobot (skala 1-10), lalu diubah ke skala 100
      let nilaiAkhir = (jumlah / totalBobot) * 10;

      let komentar;
      let warna;
      if (nilaiAkhir >= 90) {
        komentar = "Luar biasa! Layak buka warung ⭐";
        warna = "green";
      } else if (nilaiAkhir >= 75) {
        komentar = "Enak banget, tambah lagi! 😋";
        warna = "green";
      } else if (nilaiAkhir >= 60) {
        komentar = "Lumayan, masih bisa ditingkatkan 🙂";
        warna = "orange";
      } else {
        komentar = "Perlu perbaikan resep, semangat Eka! 💪";
        warna = "red";
      }

      // Jumlah emoji cabai mengikuti nilai "Level pedas" (slider ke-2)
      let pedas = Number(document.getElementById("geser1").value);
      let cabai = "🌶️".repeat(Math.ceil(pedas / 2));

      let hasil = document.getElementById("hasilSuki");
      hasil.innerText = "Nilai akhir: " + nilaiAkhir.toFixed(1) + " / 100\n" + komentar;
      hasil.style.color = warna;
      hasil.style.whiteSpace = "pre-line";

      let bar = document.getElementById("barSuki");
      bar.style.width = nilaiAkhir + "%";
      bar.style.background = warna;

      document.getElementById("infoSuki").innerText = "Tingkat pedas: " + cabai;
    }

    function ulangSuki() {
      for (let i = 0; i < kriteria.length; i++) {
        document.getElementById("geser" + i).value = 5;
        document.getElementById("angka" + i).innerText = 5;
      }
      document.getElementById("hasilSuki").innerText = "";
      document.getElementById("barSuki").style.width = "0%";
      document.getElementById("infoSuki").innerText = "";
    }

    // Tekan Enter di kolom nama/semester = klik tombol sapaan
    document.getElementById("kolomNama").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { sapa(); }
    });
    document.getElementById("kolomSemester").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { sapa(); }
    });
  </script>
</body>
</html>
