<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070912">
<title>Tata Surya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --malam:#070912; --panel:#0d1020; --tulang:#e9e6f2; --redup:#9ea1bf; --garis:rgba(233,230,242,.16); --aksen:#ffd479;
  --tampil:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --badan:"Instrument Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--malam);color:var(--tulang);font-family:var(--badan);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 350px;height:100vh;height:100svh}
.scene{position:relative;min-width:0;min-height:0;overflow:hidden}
#ruang{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#ruang:active{cursor:grabbing}

.kepala{position:absolute;left:20px;top:16px;right:20px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kepala>*{pointer-events:auto}
.balik{color:var(--redup);text-decoration:none;font-size:14px}
.balik:hover{color:var(--tulang)}
h1{font-family:var(--tampil);font-weight:300;font-size:clamp(30px,4.4vw,52px);line-height:1;letter-spacing:-.03em;font-variation-settings:"wdth" 82,"opsz" 72;margin-top:6px}
#waktu{margin-top:10px;font-size:17px;font-variant-numeric:tabular-nums}
#status{font-size:13px;color:var(--redup);margin-top:2px}
#status b{color:var(--aksen);font-weight:600}
.kanan{text-align:right;font-size:13px;color:var(--redup)}

.kontrol{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.baris{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--garis);background:rgba(13,16,32,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:rgba(233,230,242,.5)}
.chip[aria-pressed="true"]{background:var(--tulang);color:var(--malam);border-color:var(--tulang);font-weight:600}
.chip:focus-visible,.pilih:focus-visible,.balik:focus-visible{outline:2px solid var(--aksen);outline-offset:2px}
.tgl{background:rgba(13,16,32,.72);border:1px solid var(--garis);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--tulang);backdrop-filter:blur(8px)}
.tgl::-webkit-calendar-picker-indicator{filter:invert(.85)}

.panel{background:var(--panel);border-left:1px solid var(--garis);overflow-y:auto;padding:18px 20px 28px}
.pilih-baris{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.pilih{border:1px solid var(--garis);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pilih i{width:8px;height:8px;border-radius:50%;display:block}
.pilih[aria-pressed="true"]{background:var(--tulang);color:var(--malam);border-color:var(--tulang);font-weight:600}
.pilih:hover{border-color:rgba(233,230,242,.55)}
#nama{font-family:var(--tampil);font-weight:300;font-size:38px;line-height:1.05;letter-spacing:-.03em;font-variation-settings:"wdth" 82,"opsz" 72}
#jenis{color:var(--redup);margin-top:2px}
.bolawrap{display:grid;place-items:center;margin:14px 0 4px}
#bola{width:250px;height:250px;max-width:100%}
.cap{color:var(--redup);font-size:12.5px;text-align:center;margin-bottom:12px}
dl{border-top:1px solid var(--garis)}
.r{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--garis);align-items:baseline}
.r dt{color:var(--redup)}
.r dd{text-align:right;font-variant-numeric:tabular-nums}
.fakta{margin-top:16px;color:var(--tulang);opacity:.88;max-width:46ch}
.catatan{margin-top:16px;color:var(--redup);font-size:12.5px;max-width:48ch}

@media (max-width:900px){
  .app{display:block;height:auto}
  .scene{height:64svh;min-height:430px}
  .kontrol{position:static;padding:10px 14px 14px;background:var(--malam)}
  .scenewrap{position:relative}
  .panel{border-left:0;border-top:1px solid var(--garis)}
  .kepala{left:14px;right:14px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <div class="scenewrap" style="min-width:0;display:flex;flex-direction:column">
    <div class="scene" id="scene" style="flex:1">
      <canvas id="ruang" aria-label="Simulasi tata surya"></canvas>
      <div class="kepala">
        <div>
          <a class="balik" href="index.html">Beranda</a>
          <h1>Tata Surya</h1>
          <div id="waktu"></div>
          <div id="status"></div>
        </div>
        <div class="kanan" id="infoKamera"></div>
      </div>
      <div class="kontrol" id="kontrolDesktop"></div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="pilih-baris" id="pilih"></div>
    <h2 id="nama"></h2>
    <div id="jenis"></div>
    <div class="bolawrap"><canvas id="bola" width="250" height="250"></canvas></div>
    <div class="cap" id="cap"></div>
    <dl id="data"></dl>
    <p class="fakta" id="fakta"></p>
    <p class="catatan">Posisi dihitung dari elemen orbit rata-rata planet (perkiraan JPL untuk tahun 1800 sampai 2050), akurat sekitar sepersekian derajat. Ukuran planet dan jarak Bulan digambar tidak sesuai skala. Permukaan pada bola adalah ilustrasi, bukan foto.</p>
  </aside>
</div>

<script>
/* ============ Data ============ */
const AU_KM = 149597870.7, GM_SUN = 1.32712440018e11; // km^3/s^2
const RAD = Math.PI/180;
// elemen: [a, a', e, e', I, I', L, L', varpi, varpi', Omega, Omega'] (derajat, per abad)
const BODIES = [
  {id:"matahari", nama:"Matahari", jenis:"Bintang", warna:"#ffb938", rpx:20, rotJam:25.05*24, miring:7.25, rfrac:.46, rho:7.25, phi0:0.1,
   fakta:"Matahari berputar lebih cepat di ekuator (sekitar 25 hari) daripada di kutub (sekitar 35 hari) karena berupa gas. Ia memuat sekitar 99,86% massa seluruh tata surya."},
  {id:"merkurius", nama:"Merkurius", jenis:"Planet kebumian", warna:"#a8a29e", rpx:4.5, rotJam:1407.6, miring:0.03, rfrac:.46, rho:0, phi0:0.1,
   el:[0.38709927,0.00000037,0.20563593,0.00001906,7.00497902,-0.00594749,252.25032350,149472.67411175,77.45779628,0.16047689,48.33076593,-0.12534081],
   fakta:"Merkurius berputar tepat tiga kali setiap dua kali mengelilingi Matahari. Satu hari matahari di sana (matahari terbit ke terbit) berlangsung sekitar 176 hari Bumi, lebih lama dari dua tahunnya."},
  {id:"venus", nama:"Venus", jenis:"Planet kebumian", warna:"#e8c98b", rpx:6.5, rotJam:-5832.5, miring:177.4, rfrac:.46, rho:177.4, phi0:0.1,
   el:[0.72333566,0.00000390,0.00677672,-0.00004107,3.39467605,-0.00078890,181.97909950,58517.81538729,131.60246718,0.00268329,76.67984255,-0.27769418],
   fakta:"Venus berputar mundur (searah jarum jam dilihat dari utara) dan sangat lambat: satu putaran penuh lebih lama dari satu tahunnya."},
  {id:"bumi", nama:"Bumi", jenis:"Planet kebumian", warna:"#4f9be8", rpx:7, rotJam:23.9345, miring:23.44, rfrac:.46, rho:0, phi0:0,
   el:[1.00000261,0.00000562,0.01671123,-0.00004392,-0.00001531,-0.01294668,100.46457166,35999.37244981,102.93768193,0.32327364,0,0],
   fakta:"Satu putaran Bumi terhadap bintang memakan 23 jam 56 menit. Empat menit lebih panjang untuk satu hari matahari karena Bumi juga bergerak mengelilingi Matahari."},
  {id:"mars", nama:"Mars", jenis:"Planet kebumian", warna:"#d9693f", rpx:5, rotJam:24.6229, miring:25.19, rfrac:.46, rho:25.19, phi0:0.1,
   el:[1.52371034,0.00001847,0.09339410,0.00007882,1.84969142,-0.00813131,-4.55343205,19140.30268499,-23.94362959,0.44441088,49.55953891,-0.29257343],
   fakta:"Hari di Mars hanya sekitar 37 menit lebih panjang dari hari di Bumi, dan sumbunya miring hampir sama sehingga Mars juga punya musim."},
  {id:"jupiter", nama:"Jupiter", jenis:"Raksasa gas", warna:"#d8b48a", rpx:15, rotJam:9.925, miring:3.13, rfrac:.46, rho:3.13, phi0:0.1,
   el:[5.20288700,-0.00011607,0.04838624,-0.00013253,1.30439695,-0.00183714,34.39644051,3034.74612775,14.72847983,0.21252668,100.47390909,0.20469106],
   fakta:"Jupiter adalah planet berputar tercepat: satu hari kurang dari 10 jam. Putaran itu membuat planetnya sedikit memipih dan awannya tersusun jadi pita."},
  {id:"saturnus", nama:"Saturnus", jenis:"Raksasa gas", warna:"#e6cf9c", rpx:13, rotJam:10.656, miring:26.73, rfrac:.2, rho:26.73, phi0:0.32, cincin:true,
   el:[9.53667594,-0.00125060,0.05386179,-0.00050991,2.48599187,0.00193609,49.95424423,1222.49362201,92.59887831,-0.41897216,113.66242448,-0.28867794],
   fakta:"Cincin Saturnus membentang ratusan ribu kilometer tetapi sangat tipis, hanya puluhan meter tebalnya di sebagian besar bagian."},
  {id:"uranus", nama:"Uranus", jenis:"Raksasa es", warna:"#9fe0e6", rpx:10, rotJam:-17.24, miring:97.77, rfrac:.46, rho:97.77, phi0:0.15,
   el:[19.18916464,-0.00196176,0.04725744,-0.00004397,0.77263783,-0.00242939,313.23810451,428.48202785,170.95427630,0.40805281,74.01692503,0.04240589],
   fakta:"Uranus berputar hampir menyamping (sumbunya miring sekitar 98 derajat), jadi kutubnya bergantian menghadap Matahari selama sekitar 42 tahun."},
  {id:"neptunus", nama:"Neptunus", jenis:"Raksasa es", warna:"#4a74e6", rpx:10, rotJam:16.11, miring:28.32, rfrac:.46, rho:28.32, phi0:0.1,
   el:[30.06992276,0.00026291,0.00859048,0.00005105,1.77004347,0.00035372,-55.12002969,218.45945325,44.96476227,-0.32241464,131.78422574,-0.00508664],
   fakta:"Neptunus tidak terlihat dengan mata telanjang. Satu tahunnya sekitar 165 tahun Bumi, dan ia baru menyelesaikan orbit pertamanya sejak ditemukan pada 2011."}
];
const PLANET = BODIES.filter(b=>b.el);
const BYID = {}; BODIES.forEach(b=>BYID[b.id]=b);

/* ============ Mekanika orbit ============ */
function jd(ms){ return ms/86400000 + 2440587.5 }
function toEkliptika(xp,yp,I,w,O){
  const cw=Math.cos(w), sw=Math.sin(w), cO=Math.cos(O), sO=Math.sin(O), cI=Math.cos(I), sI=Math.sin(I);
  return [
    (cw*cO - sw*sO*cI)*xp + (-sw*cO - cw*sO*cI)*yp,
    (cw*sO + sw*cO*cI)*xp + (-sw*sO + cw*cO*cI)*yp,
    (sw*sI)*xp + (cw*sI)*yp
  ];
}
function elemen(b,T){
  const e=b.el;
  const a=e[0]+e[1]*T, ec=e[2]+e[3]*T, I=(e[4]+e[5]*T)*RAD, L=e[6]+e[7]*T, vp=e[8]+e[9]*T, O=(e[10]+e[11]*T)*RAD;
  return {a:a, e:ec, I:I, L:L, vp:vp, O:O, w:(vp*RAD - O)};
}
function selesaikanKepler(M,e){
  M = ((M+Math.PI)%(2*Math.PI) + 2*Math.PI)%(2*Math.PI) - Math.PI;
  let E = M + e*Math.sin(M);
  for(let i=0;i<8;i++){ E -= (E - e*Math.sin(E) - M)/(1 - e*Math.cos(E)); }
  return E;
}
// posisi heliosentris ekliptika (AU) dan data turunan
function posisi(b, ms){
  const T=(jd(ms)-2451545.0)/36525, p=elemen(b,T);
  const M=(p.L - p.vp)*RAD, E=selesaikanKepler(M,p.e);
  const xp=p.a*(Math.cos(E)-p.e), yp=p.a*Math.sqrt(1-p.e*p.e)*Math.sin(E);
  const v=toEkliptika(xp,yp,p.I,p.w,p.O), r=Math.hypot(xp,yp);
  const kec=Math.sqrt(GM_SUN*(2/(r*AU_KM) - 1/(p.a*AU_KM))); // km/s
  return {x:v[0],y:v[1],z:v[2],r:r,a:p.a,e:p.e,kec:kec,bujur:((Math.atan2(v[1],v[0])/RAD)+360)%360};
}
function titikOrbit(b, ms, n){
  const T=(jd(ms)-2451545.0)/36525, p=elemen(b,T), out=[];
  for(let k=0;k<=n;k++){
    const E=2*Math.PI*k/n, xp=p.a*(Math.cos(E)-p.e), yp=p.a*Math.sqrt(1-p.e*p.e)*Math.sin(E);
    out.push(toEkliptika(xp,yp,p.I,p.w,p.O));
  }
  return out;
}
function periodeTahun(b){ return Math.pow(b.el[0],1.5) }

// Bumi: Matahari, GMST, dan Bulan
function dataBumi(ms){
  const d=jd(ms)-2451545.0, T=d/36525, pe=posisi(BYID.bumi,ms);
  const lamSun=Math.atan2(-pe.y,-pe.x); // bujur Matahari geosentris
  const eps=(23.4393-0.0130042*T)*RAD;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lamSun), Math.cos(lamSun));
  const dek=Math.asin(Math.sin(eps)*Math.sin(lamSun));
  const gmst=(((280.46061837+360.98564736629*d)%360)+360)%360;
  let lonSub=((ra/RAD - gmst + 540)%360)-180;
  const Lm=((218.316+13.176396*d)%360+360)%360;
  let elong=((Lm - lamSun/RAD)%360+360)%360;
  const iluminasi=(1-Math.cos(elong*RAD))/2;
  return {lonSub:lonSub, dek:dek/RAD, Lm:Lm, elong:elong, ilum:iluminasi, gmst:gmst};
}
function namaFase(el){
  if(el<22.5||el>=337.5) return "Bulan baru";
  if(el<67.5) return "Sabit awal (membesar)";
  if(el<112.5) return "Separuh awal (kuartir pertama)";
  if(el<157.5) return "Cembung awal (membesar)";
  if(el<202.5) return "Bulan purnama";
  if(el<247.5) return "Cembung akhir (mengecil)";
  if(el<292.5) return "Separuh akhir (kuartir terakhir)";
  return "Sabit akhir (mengecil)";
}

/* ============ Simulasi waktu ============ */
const KECEPATAN = [
  {k:"Waktu nyata", s:1},
  {k:"1 jam/dtk", s:3600},
  {k:"1 hari/dtk", s:86400},
  {k:"1 minggu/dtk", s:604800},
  {k:"1 bulan/dtk", s:2629800},
  {k:"1 tahun/dtk", s:31557600}
];
const sim = {t:Date.now(), speed:1, dir:1, live:true, dijeda:false};
let terakhir = performance.now();
function majuWaktu(now){
  const dt=Math.min(now-terakhir,100)/1000; terakhir=now;
  if(sim.dijeda) return;
  if(sim.live){ sim.t=Date.now(); return }
  sim.t += dt*1000*sim.speed*sim.dir;
}

/* ============ Kamera ============ */
const kam = {yaw:0, tilt:0.95, zoom:1, ikuti:false, skala:"akar", label:true, orbit:true};
const $ = id => document.getElementById(id);
const cv=$("ruang"), g=cv.getContext("2d");
let W=0,H=0,DPR=1,RMAX=300, bintangBg=null;
function ukur(){
  const r=$("scene").getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width); H=Math.max(200,r.height);
  cv.width=W*DPR; cv.height=H*DPR;
  RMAX=0.47*Math.min(W,H*1.05);
  bintangBg=document.createElement("canvas"); bintangBg.width=cv.width; bintangBg.height=cv.height;
  const bg=bintangBg.getContext("2d"); bg.fillStyle="#070912"; bg.fillRect(0,0,cv.width,cv.height);
  const n=Math.floor(W*H/2600);
  for(let i=0;i<n;i++){
    const x=Math.random()*cv.width, y=Math.random()*cv.height, r2=Math.random()*1.1*DPR+0.2;
    bg.globalAlpha=0.25+Math.random()*0.7; bg.fillStyle=["#fff","#cfe0ff","#ffe6d0"][i%3];
    bg.beginPath(); bg.arc(x,y,r2,0,6.2832); bg.fill();
  }
}
// peta jarak AU -> piksel (zoom 1)
function petaR(r){ return kam.skala==="akar" ? Math.sqrt(r/30)*RMAX : (r/30)*RMAX }
function petaVek(x,y,z){
  const r=Math.hypot(x,y,z); if(r<1e-9) return [0,0,0];
  const f=petaR(r)/r; return [x*f,y*f,z*f];
}
// vektor (px) -> layar relatif (sx, sy, kedalaman)
function proyeksi(x,y,z){
  const cy=Math.cos(kam.yaw), sy=Math.sin(kam.yaw);
  const x1=x*cy - y*sy, y1=x*sy + y*cy;
  const ct=Math.cos(kam.tilt), st=Math.sin(kam.tilt);
  return [x1, -(y1*ct + z*st), -y1*st + z*ct];
}

/* ============ Menggambar tampilan utama ============ */
const POSISI = {}; // posisi layar per benda untuk klik
let dipilih = "bumi";
function gambar(){
  const ms=sim.t;
  g.setTransform(1,0,0,1,0,0);
  g.drawImage(bintangBg,0,0);
  g.setTransform(DPR,0,0,DPR,0,0);

  // posisi dunia (px zoom 1)
  const dunia={};
  dunia.matahari=[0,0,0];
  const nyata={};
  PLANET.forEach(function(b){ const p=posisi(b,ms); nyata[b.id]=p; dunia[b.id]=petaVek(p.x,p.y,p.z) });

  // pusat kamera
  let cx=0,cy=0;
  if(kam.ikuti && dunia[dipilih]){
    const v=dunia[dipilih], q=proyeksi(v[0]*kam.zoom,v[1]*kam.zoom,v[2]*kam.zoom); cx=q[0]; cy=q[1];
  }
  const ox=W/2 - cx, oy=H/2 - cy;
  function ke(v){ const q=proyeksi(v[0]*kam.zoom,v[1]*kam.zoom,v[2]*kam.zoom); return [ox+q[0], oy+q[1], q[2]] }

  // orbit
  if(kam.orbit){
    PLANET.forEach(function(b){
      const pts=titikOrbit(b,ms,160), sel=(b.id===dipilih);
      g.beginPath();
      for(let i=0;i<pts.length;i++){
        const s=ke(petaVek(pts[i][0],pts[i][1],pts[i][2]));
        if(i===0) g.moveTo(s[0],s[1]); else g.lineTo(s[0],s[1]);
      }
      g.strokeStyle = sel ? b.warna : "rgba(233,230,242,.2)";
      g.globalAlpha = sel ? .9 : 1;
      g.lineWidth = sel ? 1.6 : 1; g.stroke(); g.globalAlpha=1;
    });
  }

  // kumpulkan benda lalu urutkan menurut kedalaman
  const daftar=[{id:"matahari",s:ke([0,0,0])}];
  PLANET.forEach(b=>daftar.push({id:b.id,s:ke(dunia[b.id])}));
  daftar.sort((p,q)=>p.s[2]-q.s[2]);
  const matS=ke([0,0,0]);

  // Bulan (jarak digambar dilebihkan)
  let bulan=null;
  const db=dataBumi(ms);
  if(dunia.bumi){
    const sb=ke(dunia.bumi), mr=Math.max(16, 7*1.9);
    const th=db.Lm*RAD, q=proyeksi(Math.cos(th)*mr, Math.sin(th)*mr, 0);
    bulan={x:sb[0]+q[0], y:sb[1]+q[1], depth:sb[2]+q[2], mr:mr, bx:sb[0], by:sb[1]};
  }

  daftar.forEach(function(o){
    const b=BYID[o.id], x=o.s[0], y=o.s[1];
    POSISI[o.id]={x:x,y:y,r:Math.max(b.rpx,10)};
    if(o.id==="matahari"){
      const gl=g.createRadialGradient(x,y,b.rpx*0.5,x,y,b.rpx*4.5);
      gl.addColorStop(0,"rgba(255,190,80,.55)"); gl.addColorStop(1,"rgba(255,160,40,0)");
      g.fillStyle=gl; g.beginPath(); g.arc(x,y,b.rpx*4.5,0,6.2832); g.fill();

function renderBola(b, ms){

      const x=(px+.5-cx)/R, y=(cy-py-.5)/R, d2=x*x+y*y, i=(py*N+px)*4;

        const zr=-y1*cp/sp, rp=Math.hypot(x1,y1/sp);
        if(rp>1.3 && rp<2.35 && (d2>1 || zr>zS)){

}

  if(sim.live) s="<b>Langsung</b>, mengikuti jam perangkatmu";
  else if(sim.dijeda) s="Dijeda";
  else s="Simulasi "+(KECEPATAN.find(k=>k.s===sim.speed)||{k:"x"}).k.toLowerCase()+(sim.dir<0?", mundur":"");
  $("status").innerHTML=s;
  $("infoKamera").textContent="Zoom "+fmt(kam.zoom,1)+"×";
}

/* ============ Interaksi kanvas ============ */
const ptr=new Map(); let geser=0, jarakCubit=0;
cv.addEventListener("pointerdown",function(e){ cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); geser=0; if(ptr.size===2){ const [a,b]=[...ptr.values()]; jarakCubit=Math.hypot(a.x-b.x,a.y-b.y) } });
cv.addEventListener("pointermove",function(e){
  if(!ptr.has(e.pointerId)) return;
  const p=ptr.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY; geser+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size===1){ kam.yaw+=dx*0.008; kam.tilt=Math.max(0,Math.min(1.45,kam.tilt+dy*0.006)) }
  else if(ptr.size===2){ const [a,b]=[...ptr.values()], j=Math.hypot(a.x-b.x,a.y-b.y); if(jarakCubit>0){ kam.zoom=Math.max(0.4,Math.min(60,kam.zoom*j/jarakCubit)) } jarakCubit=j }
});
function lepas(e){
  if(ptr.size===1 && geser<6){
    const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top; let terdekat=null, jar=1e9;
    for(const id in POSISI){ const q=POSISI[id], d=Math.hypot(q.x-x,q.y-y); if(d<q.r+10 && d<jar){ jar=d; terdekat=id } }
    if(terdekat) pilih(terdekat);
  }
  ptr.delete(e.pointerId); if(ptr.size<2) jarakCubit=0;
}
cv.addEventListener("pointerup",lepas); cv.addEventListener("pointercancel",function(e){ ptr.delete(e.pointerId) });
cv.addEventListener("wheel",function(e){ e.preventDefault(); kam.zoom=Math.max(0.4,Math.min(60,kam.zoom*Math.exp(-e.deltaY*0.0015))) },{passive:false});

/* ============ Loop ============ */
let tPanel=0, tBola=0;
function loop(now){
  majuWaktu(now);
  gambar();
  if(now-tBola>33){ renderBola(BYID[dipilih],sim.t); tBola=now }
  if(now-tPanel>150){ panelUpdate(false); perbaruiHeader(); tPanel=now }
  requestAnimationFrame(loop);
}
addEventListener("resize",ukur);
new ResizeObserver(ukur).observe($("scene"));
ukur(); buatPilih(); bangunKontrol(); pilih("bumi"); perbaruiHeader();
requestAnimationFrame(loop);
</script>
